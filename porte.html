<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FM Coop | Italia · Côte d'Azur</title>
<meta name="description" content="FM Coop Italia e FM Coop Côte d'Azur: il reparto operativo di B&amp;B, affitti brevi e immobili." />
<meta name="theme-color" content="#111214" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=2" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@500;600&display=swap" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,Arial,sans-serif;background:#111214;color:#fff}
  .porte{display:flex;height:100vh;height:100svh}
  .porta{position:relative;flex:1;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;color:#fff;text-decoration:none}
  .porta video,.porta img.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .porta::after{content:"";position:absolute;inset:0;background:rgba(10,12,16,.45);transition:background .4s}
  .porta:hover::after{background:rgba(10,12,16,.25)}
  .testo{position:relative;z-index:2}
  .porta h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(2.4rem,5vw,4.4rem);line-height:1}
  .porta span{display:inline-block;margin-top:22px;padding:12px 28px;border:1.5px solid #fff;border-radius:40px;font-weight:600;transition:background .3s,color .3s}
  .porta:hover span{background:#fff;color:#111214}
  .logo{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.05rem}
  .logo img{height:30px}
  @media (max-width:760px){.porte{flex-direction:column}.porta{flex:1}}
</style>
</head>
<body>
<div class="logo"><img src="assets/fm-mark-bianco.png?v=2" alt="" />FM Coop</div>
<main class="porte">
  <a class="porta" href="index.html" hreflang="it">
    <video autoplay muted loop playsinline preload="auto" poster="assets/hero-squadra.jpg" aria-hidden="true">
      <source src="assets/hero-video-mobile.mp4" type="video/mp4" media="(max-width: 820px)" />
      <source src="assets/hero-video-web.mp4" type="video/mp4" />
    </video>
    <div class="testo"><h2>Italia</h2><span>Entra</span></div>
  </a>
  <a class="porta" href="fr/" hreflang="fr">
    <video autoplay muted loop playsinline preload="auto" poster="assets/nizza-poster.jpg" aria-hidden="true">
      <source src="assets/nizza-video-mobile.mp4" type="video/mp4" media="(max-width: 820px)" />
      <source src="assets/nizza-video-web.mp4" type="video/mp4" />
    </video>
    <div class="testo"><h2>Côte d'Azur</h2><span>Entrer</span></div>
  </a>
</main>
<script>
  /* Se il telefono blocca l'avvio automatico, il video parte al primo tocco o scorrimento */
  (function(){
    var vv=[].slice.call(document.querySelectorAll("video"));
    function avvia(){vv.forEach(function(v){var p=v.play();if(p&&p.catch)p.catch(function(){});});}
    avvia();
    ["touchstart","click","scroll"].forEach(function(e){window.addEventListener(e,avvia,{once:true,passive:true});});
  })();
</script>
</body>
</html>
