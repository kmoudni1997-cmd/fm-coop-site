*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.35;-webkit-tap-highlight-color:transparent}

h2{font-size:13px;margin:0;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.row{display:flex;align-items:center;gap:12px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--grey);flex:none}
.dot.doing{background:var(--warn)}.dot.done{background:var(--ok)}

.apt:active,.tile:active{background:var(--tap)}
.apt .n{font-weight:700;font-size:18px}.apt .s{color:var(--mute);font-size:14px}
.apt .t{margin-left:auto;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap;text-align:right}

.btn{background:var(--nero);color:var(--nero-ink);border:0;border-radius:12px;padding:16px;font:inherit;font-weight:700;font-size:17px;width:100%}
.btn:disabled{background:var(--grey);color:#fff}
.btn.ghost{background:transparent;color:var(--nero);border:2px solid var(--nero)}

.ph .slot{width:78px;height:78px;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--mute);font-size:12px;text-align:center;position:relative;overflow:hidden;background:var(--tap)}
.ph .slot img{width:100%;height:100%;object-fit:cover}
.ph .slot input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.ph .slot.ok{border-style:solid;border-color:var(--ok)}
.ph .slot.key{border-color:var(--acc);background:var(--warn-bg);font-weight:700}

textarea,select,input[type=text],input[type=password],input[type=date],input[type=number]{width:100%;font:inherit;font-size:17px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.kv{display:grid;grid-template-columns:118px 1fr;gap:8px 12px;font-size:15px}
.kv b{color:var(--mute);font-weight:600}
.login{display:flex;flex-direction:column;gap:14px;padding-top:26px}
.login .brand{width:64px;height:64px;font-size:24px;border-radius:16px;margin:0 auto;background:var(--nero);color:#fff}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:9;max-width:90%;text-align:center;font-size:15px}
.note{font-size:13px;color:var(--mute);margin:0}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--mute)}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto}
.tabs button{flex:1;border:0;background:transparent;font:inherit;font-weight:700;padding:10px 6px;border-radius:9px;color:var(--mute);font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--nero);color:#fff}
.err{color:var(--bad);font-weight:700;text-align:center;min-height:22px;font-size:15px}
.warnbox{margin:10px 0 0;color:var(--warn);font-weight:600;font-size:15px}
.closed{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
.timer{display:flex;align-items:center;gap:10px;margin-top:10px}
.timer .trk{flex:1;height:10px;border-radius:5px;background:var(--tap);overflow:hidden}
.timer .fil{height:100%;background:var(--ok);border-radius:5px}
.timer.warn .fil{background:var(--warn)}.timer.over .fil{background:var(--bad)}
.timer b{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.timer.over b{color:var(--bad)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.loading{text-align:center;color:var(--mute);padding:30px 0}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--nero);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.assign{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.assign:first-child{border-top:0}
.assign select{padding:10px;font-size:15px}
</style>
</head>

  if(dels.length){var r8=await sb.from('program').delete().eq('day',S.boss.date).in('apt_id',dels);if(r8.error){S.busy=false;throw r8.error;}}
  S.busy=false;await loadBoss();S.boss.tab='pass';render();toast('Programma salvato');return;}
 }catch(err){S.busy=false;fail(err);render();}
});
app.addEventListener('change',async function(e){
 var t=e.target;
 try{
 if(t.id==='bdate'){S.boss.date=t.value;await loadBoss();render();return;}
 if(t.dataset.day){S.day[t.dataset.day]=t.checked;var r=await sb.from('day_check').upsert({user_id:S.user.id,day:todayStr(),items:S.day},{onConflict:'user_id,day'});if(r.error)throw r.error;return;}
 if(t.dataset.chk){var p=passOf(S.apt);if(!p)return;p.checklist=p.checklist||{};p.checklist[t.dataset.chk]=t.checked;var r2=await sb.from('passaggi').update({checklist:p.checklist}).eq('id',p.id);if(r2.error)throw r2.error;return;}
 if(t.dataset.photo){var f=t.files&&t.files[0];if(!f)return;var p2=passOf(S.apt);if(!p2)return;var sl=t.closest('.slot');sl.classList.add('busy');
  var blob=await shrink(f,1280);var kind=t.dataset.photo;var path=S.user.id+'/'+p2.id+'/'+kind.replace(/[^a-z0-9]/gi,'_').toLowerCase()+'.jpg';
  var up=await sb.storage.from('foto').upload(path,blob,{contentType:'image/jpeg',upsert:true});if(up.error)throw up.error;
  S.photos[p2.id]=S.photos[p2.id]||{};
  if(!S.photos[p2.id][kind]){var ins=await sb.from('photos').insert({passaggio_id:p2.id,user_id:S.user.id,kind:kind,path:path}).select().single();if(ins.error)throw ins.error;S.photos[p2.id][kind]=ins.data;}
  S.photos[p2.id][kind]._url=URL.createObjectURL(blob);render();toast('Foto '+kind+' salvata');return;}
 if(t.id==='sphoto'){var f2=t.files&&t.files[0];if(!f2)return;S._sfile=f2;var sl2=document.getElementById('sslot');sl2.classList.add('ok');var img=new Image();img.src=URL.createObjectURL(f2);img.alt='';sl2.insertBefore(img,sl2.firstChild);return;}
 }catch(err){fail(err);render();}
});

// ===== AVVIO =====
(async function(){
 try{var s=await sb.auth.getSession();if(s.data&&s.data.session){S.user=s.data.session.user;await afterLogin();}else{S.view='login';}}
 catch(e){S.view='login';S.err='Connessione non riuscita, riprova.';console.error(e);}
 render();
 setInterval(function(){if(!S.user||!S.profile||S.profile.role==='boss')return;var v=S.view;S.program.forEach(function(pr){if(status(pr)==='over'&&(v==='oggi'||(S.apt&&S.apt.id===pr.id)))alarm(pr.id);});if(v==='apt'||v==='oggi')render();},30000);
 sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT'){S.user=null;S.profile=null;S.view='login';render();}});
})();
</script>
