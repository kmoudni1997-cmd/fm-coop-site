<style>
:root{--bg:#f4f5f7;--card:#ffffff;--ink:#16181b;--mute:#666d74;--line:#e2e4e7;--nero:#111214;--nero-ink:#ffffff;--acc:#e0a63a;--ok:#2e8b57;--ok-bg:#e6f4ec;--warn:#c98a00;--warn-bg:#fff4dc;--bad:#c0392b;--bad-bg:#fdecea;--grey:#b9c0c7;--tap:#eef0f3;--blue:#2f6fb5;--blue-bg:#e8f0fa;--viola:#7a4fb5;--viola-bg:#f0e9fa}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans Arabic","Noto Sans Sinhala","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent}
#app{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--nero);color:var(--nero-ink);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:12px;min-height:56px}
.top b{font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{background:transparent;border:0;color:var(--nero-ink);font:inherit;font-weight:600;font-size:15px;padding:8px 6px}
.brand{width:38px;height:38px;display:block;flex:none;object-fit:contain}
.logo-login{width:150px;margin:0 auto;display:block}
.shell{display:flex;flex:1;min-height:0}
.side{display:none}
main{padding:16px 16px 120px;display:flex;flex-direction:column;gap:14px;flex:1;width:100%;max-width:560px;margin:0 auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;border:0;background:transparent;font:inherit;font-size:11px;font-weight:600;color:var(--mute);padding:6px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button .ic{font-size:20px}
.nav button.on{color:var(--nero);background:var(--tap)}
h1{font-size:22px;margin:0;font-weight:800;text-wrap:balance}
h2{font-size:12px;margin:0;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.row{display:flex;align-items:center;gap:12px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--grey);flex:none}
.dot.doing{background:var(--warn)}.dot.done{background:var(--ok)}
.dot.over{background:var(--bad);box-shadow:0 0 0 3px var(--bad-bg)}
@media (prefers-reduced-motion:no-preference){.dot.over{animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:.35}}}
.apt{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);background:var(--card);border-radius:14px;text-align:left;font:inherit;color:inherit;width:100%}
.apt:active,.tile:active{background:var(--tap)}
.apt .n{font-weight:700;font-size:17px}.apt .s{color:var(--mute);font-size:13px}
.apt .t{margin-left:auto;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap;text-align:right}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.grey{background:var(--tap);color:var(--mute)}.pill.blue{background:var(--blue-bg);color:var(--blue)}.pill.viola{background:var(--viola-bg);color:var(--viola)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 14px;font:inherit;color:inherit;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:92px}
.tile .ic{font-size:24px}.tile .l{font-weight:700;font-size:16px}.tile .m{color:var(--mute);font-size:12px}
.btn{background:var(--nero);color:var(--nero-ink);border:0;border-radius:12px;padding:15px;font:inherit;font-weight:700;font-size:16px;width:100%}
.btn:disabled{background:var(--grey);color:#fff}
.btn.ghost{background:transparent;color:var(--nero);border:2px solid var(--nero)}
.btn.acc{background:var(--acc);color:#16181b}
.btn.sm{padding:10px 14px;font-size:14px;width:auto}
.chk{display:flex;align-items:center;gap:14px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.chk:first-of-type{border-top:0}
.chk input{width:26px;height:26px;flex:none;accent-color:var(--ok)}
.chk label{flex:1}
.ph{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.ph .slot{width:78px;height:78px;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--mute);font-size:12px;text-align:center;position:relative;overflow:hidden;background:var(--tap)}
.ph .slot img{width:100%;height:100%;object-fit:cover}
.ph .slot input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.ph .slot.ok{border-style:solid;border-color:var(--ok)}
.ph .slot.key{border-color:var(--acc);background:var(--warn-bg);font-weight:700}
.ph .slot.key.ok{border-color:var(--ok)}
.ph .slot.busy{opacity:.5}
.voci{margin:0 0 6px;padding-left:20px;color:var(--ink)}.voci li{padding:5px 0;border-bottom:1px solid var(--line)}.voci li:last-child{border-bottom:0}
.chk.grp-ok{border-top:2px solid var(--line);padding-top:10px;margin-top:4px}.chk.grp-ok input{width:28px;height:28px}
[dir=rtl] .voci{padding-left:0;padding-right:20px}
.ph .slot .sx{position:absolute;top:3px;right:3px;z-index:2;width:24px;height:24px;border-radius:50%;border:0;background:rgba(17,19,21,.75);color:#fff;font-size:13px;line-height:24px;padding:0}
[dir=rtl] .ph .slot .sx{right:auto;left:3px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);z-index:7}
.bar .in{max-width:528px;margin:0 auto}
.list .it{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.thumbs.big{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumbs.big a{display:block;text-decoration:none;color:var(--nero)}
.thumbs.big img{width:100%;height:auto;aspect-ratio:3/4;object-fit:cover;border-radius:12px;display:block;border:1px solid var(--line)}
.thumbs.big span{display:block;font-size:12px;color:var(--mute);margin-top:4px;text-align:center}
.grp{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:12px 14px;font:inherit;color:var(--nero);cursor:pointer}
.grp b{font-size:15px}.grp .ic{margin-left:auto;color:var(--mute)}.grp.on{border-bottom:1px solid var(--line)}
.seg{display:inline-flex;background:var(--tap);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;font:inherit;font-weight:700;font-size:13px;padding:7px 12px;border-radius:9px;color:var(--mute)}
.seg button.on{background:#fff;color:var(--nero);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.mini.on{background:var(--nero);color:#fff}
.mini.selok{background:#1f8a4c;color:#fff}
.mini.selno{background:#555;color:#fff}
.gt{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px}
.gt table{border-collapse:collapse;font-size:13px;min-width:100%}
.gt th{position:sticky;top:0;background:var(--nero);color:#fff;text-align:left;padding:7px 8px;font-weight:700;white-space:nowrap;font-size:12px}
.gt td{padding:6px 8px;border-top:1px solid var(--line);white-space:nowrap;vertical-align:top}
.gt tr:nth-child(even) td{background:rgba(0,0,0,.02)}
.gt input,.gt select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;background:#fff}
.mini{background:var(--tap);border:0;border-radius:10px;padding:9px 13px;font:inherit;font-weight:700;color:var(--nero);font-size:13px;white-space:nowrap}
.mini.on{background:var(--bad-bg);color:var(--bad)}
.mini.x{padding:6px 9px;font-size:12px}
textarea,select,input[type=text],input[type=password],input[type=date],input[type=number],input[type=time],input[type=url]{width:100%;font:inherit;font-size:16px;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
label.f input,label.f select,label.f textarea{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .w{grid-column:1/-1}
.kv{display:grid;grid-template-columns:118px 1fr;gap:8px 12px;font-size:15px}
.kv b{color:var(--mute);font-weight:600}
.login{display:flex;flex-direction:column;gap:14px;padding-top:26px}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pinpad button{padding:15px;font:inherit;font-size:24px;font-weight:700;border-radius:12px;border:1px solid var(--line);background:var(--card);color:inherit}
.pinpad button.del{font-size:20px}
.dots{display:flex;gap:12px;justify-content:center;padding:8px 0 2px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--nero);display:block}.dots i.f{background:var(--nero)}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:9;max-width:90%;text-align:center;font-size:15px}
.note{font-size:13px;color:var(--mute);margin:0}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--mute)}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto}
.tabs button{flex:1;border:0;background:transparent;font:inherit;font-weight:700;padding:9px 6px;border-radius:9px;color:var(--mute);font-size:13px;white-space:nowrap}
.tabs button.on{background:var(--nero);color:#fff}
.err{color:var(--bad);font-weight:700;text-align:center;min-height:22px;font-size:15px}
.warnbox{margin:10px 0 0;color:var(--warn);font-weight:600;font-size:15px}
.closed{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
.timer{display:flex;align-items:center;gap:10px;margin-top:10px}
.timer .trk{flex:1;height:10px;border-radius:5px;background:var(--tap);overflow:hidden}
.timer .fil{height:100%;background:var(--ok);border-radius:5px}
.timer.warn .fil{background:var(--warn)}.timer.over .fil{background:var(--bad)}
.timer b{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.timer.over b{color:var(--bad)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.loading{text-align:center;color:var(--mute);padding:30px 0}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--nero);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.map{width:100%;aspect-ratio:16/10;border:0;border-radius:12px;background:var(--tap)}
.agh{display:flex;align-items:center;gap:8px}
.agh h1{flex:1;font-size:18px;text-transform:capitalize}
.agh button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;font-weight:700}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mgrid .h{text-align:center;font-size:11px;color:var(--mute);font-weight:700;padding:4px 0}
.mgrid .d{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:58px;padding:5px 5px 4px;font:inherit;color:inherit;text-align:left;display:flex;flex-direction:column;gap:3px;position:relative}
.mgrid .d.off{opacity:.45}
.mgrid .d.today{border-color:var(--nero);border-width:2px}
.mgrid .d.sel{background:var(--tap)}
.mgrid .d .n{font-size:12px;font-weight:700}
.mgrid .d .b{font-size:10px;line-height:1.2;color:var(--mute);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mgrid .d .b.r{color:var(--blue);font-weight:700}.mgrid .d .b.f{color:var(--viola);font-weight:700}
.mgrid .d .cnt{position:absolute;right:5px;top:5px;font-size:10px;font-weight:800;background:var(--nero);color:#fff;border-radius:999px;padding:1px 6px}
.wk{display:flex;flex-direction:column;gap:8px}
.wk .dy{display:grid;grid-template-columns:64px 1fr;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.wk .dy.today{border-color:var(--nero);border-width:2px}
.wk .dy .dn{font-weight:800;font-size:13px;text-transform:capitalize}.wk .dy .dn small{display:block;color:var(--mute);font-weight:600}
.wk .dy .it{font-size:14px;padding:3px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--tap);border-radius:999px;padding:4px 6px 4px 10px;font-size:13px;font-weight:600}
.chip button{border:0;background:var(--line);border-radius:999px;width:20px;height:20px;font:inherit;font-size:12px;line-height:1;color:var(--ink)}
.opblock{border-top:1px solid var(--line);padding:10px 0}
.opblock:first-child{border-top:0}
.opblock .nm{font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.opblock select{padding:9px;font-size:14px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
@media (min-width:900px){
 body{font-size:15px}

 .side button{border:0;background:transparent;text-align:left;font:inherit;font-weight:600;padding:11px 12px;border-radius:10px;color:var(--mute);display:flex;gap:10px;align-items:center;font-size:15px}
 .side button .ic{font-size:18px;width:24px;text-align:center}
 .side button.on{background:var(--tap);color:var(--nero)}
 .side .sp{flex:1}
 .nav{display:none}
 main{max-width:1100px;padding:24px 28px 60px;gap:16px}
 main.narrow{max-width:640px}
 main.wide{max-width:none;padding:20px 20px 60px}
 main.wide .gt td,main.wide .gt th{padding:5px 6px}
 main.wide .gt input[type=time]{width:88px}

 .stat{grid-template-columns:repeat(4,1fr)}

 .mgrid .d{min-height:92px}
 .mgrid .d .b{font-size:12px}
 .mgrid .d .n{font-size:13px}
 .bar{left:220px}
 .top{padding:10px 20px}
}
/* arabo: scrittura da destra a sinistra */
[dir=rtl] .apt,[dir=rtl] .tile,[dir=rtl] .grp,[dir=rtl] .mgrid .d{text-align:right}
[dir=rtl] .apt .t{margin-left:0;margin-right:auto;text-align:left}
[dir=rtl] .grp .ic{margin-left:0;margin-right:auto}

[dir=rtl] [style*="margin-left:auto"]{margin-left:0!important;margin-right:auto!important}

[dir=rtl] .apt[style*="text-align:left"]{text-align:right!important}
</style>

function costoApt(a,c){
 // tutto per singolo passaggio
 var ops=S.boss.ops,pref=ops.filter(function(o){return o.username===a.preferred_username})[0];
 var oreLav=(a.max_min||90)/60;
 var costoOra=(pref&&pref.hourly_cost)?Number(pref.hourly_cost):parVal('costo_orario_lordo',12);
 var personale=oreLav*costoOra;

 var km=c&&c.km_ar?Number(c.km_ar):0;var auto=pref?pref.has_car:null;
 var rimborso=(auto===true)?km*parVal('rimborso_km',0.30):0;
 var prezzo=c&&c.prezzo_cliente!=null?Number(c.prezzo_cliente):null;
 var extraB=c&&c.biancheria_extra_prezzo?Number(c.biancheria_extra_prezzo)*(a.guests||2):0;
 var ricavo=prezzo!=null?prezzo+extraB:null;
 var costo=personale+bianch+materiali+rimborso;
 return {ore:oreLav,costoOra:costoOra,personale:personale,bianch:bianch,materiali:materiali,km:km,auto:auto,rimborso:rimborso,prezzo:prezzo,extraB:extraB,ricavo:ricavo,costo:costo,margine:ricavo!=null?ricavo-costo:null,pct:ricavo?((ricavo-costo)/ricavo*100):null};

app.addEventListener('change',async function(e){

(async function(){
 try{var s=await sb.auth.getSession();if(s.data&&s.data.session){S.user=s.data.session.user;await afterLogin();}else{S.view='login';}}
 catch(e){S.view='login';S.err='Connessione non riuscita, riprova.';console.error(e);}

 setInterval(function(){if(!S.user||!S.profile||isBoss())return;var v=S.view,aperti=0;S.program.forEach(function(pr){var q=passOf(pr);if(!pr.apt_id||!q||q.closed_at)return;if(Date.now()>=scadenza(pr,q)){autoStop(pr,q).then(function(){render();});return;}aperti++;var e=elapsedMin(q),mx=(pr.apartments&&pr.apartments.max_min)||90;
  if(e>=mx-10&&e<mx)alarm(pr.id,'pre');if(e>=mx)alarm(pr.id,'over'+Math.floor((e-mx)/10));});
  if(aperti)tieniAcceso();else lasciaSpegnere();if(v==='apt'||v==='oggi')render();},30000);
 sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT'){S.user=null;S.profile=null;S.view='login';render();}});
})();
